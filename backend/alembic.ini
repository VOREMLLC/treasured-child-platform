[alembic]
# Path to the migration scripts.
script_location = alembic

# Make `app.*` imports work from alembic/env.py.
prepend_sys_path = .

# Placeholder; the real URL is overridden in alembic/env.py with the
# value loaded from .env via app.core.config.settings.
sqlalchemy.url = sqlite:///./local.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
